<script>
    function capitalizeFirstLetter(inputElement) {
        let value = inputElement.value;
        // If the string is not empty, capitalize the first character
        if (value.length > 0) {
            inputElement.value = value.charAt(0).toUpperCase() + value.slice(1);
        }
    }

    // Ge the input field
    var input = document.getElementById("proj_name")

    // Execute a function when the user presses a key on the keyboard
  input.addEventListener("keypress", function(event) {
    // If the user presses the "Enter" key
    if (event.key === "Enter") {
      // Cancel the default action, if needed
      event.preventDefault();
      // Trigger the button element with a click
      document.getElementById("myBtn").click();
    }
  });
</script>
